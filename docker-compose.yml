services:
  backend:
    build:
      context: ./Backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: ${DATABASE_URL:-sqlite:////data/app.db}
      GEMINI_API_KEYS: ${GEMINI_API_KEYS:-}
      GROQ_API_KEYS: ${GROQ_API_KEYS:-}
      LLM_API_KEYS: ${LLM_API_KEYS:-}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173}
      ENABLE_FAILURE_SIMULATION: ${ENABLE_FAILURE_SIMULATION:-true}
      DEFAULT_MODEL: ${DEFAULT_MODEL:-groq/openai/gpt-oss-20b}
    volumes:
      - lyftr-data:/data

  frontend:
    build:
      context: ./Frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  lyftr-data:
